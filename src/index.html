<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"/>
  <script type="module" src="main.js"></script>

  <style> 
  /* Выравнивание содержимого по центру контейнера */
  .mainContainer {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  
  /* Кнопки */
  button {
    min-width: 110px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid rgba(0, 0, 0, 0.5);
    background: #3b82f6;
    font-weight: 600;
    color: #f3f4f6;
  }
  
  button:active {
    transform: translateY(1px);
  }
  </style>

</head>
<body>
  <div class="mainContainer">
    <img src="ic_launcher_round.png" style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 18px rgba(0,0,0,0.5); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; color: #f3f4f6; text-align: center;">Basic Capacitor Project</h1>

    <div>
      <button id="btn-count">Счет: 0</button>
      <button id="btn-save">Сохранить</button>
      <button id="btn-show">Показать</button>
    </div>
  </div>
</body>
</html>
